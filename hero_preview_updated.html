<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Section Preview - Studio Portrait with Orbiting Canvas &amp; Ambient Glow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      margin: 0;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      box-sizing: border-box;
      user-select: none;
      background-color: #14140F !important;
      color: #F4F3EE;
      min-height: 100vh;
    }
    .hero-bg-dark {
      background-color: #14140F !important;
    }
    .hero-bg-light {
      background-color: #F8F8F5 !important;
    }

    /* Layer 2: Adaptive Ambient Glow behind the portrait */
    .ambient-glow-layer {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: radial-gradient(circle at 50% 36%, rgba(245, 158, 11, 0.22) 0%, rgba(217, 119, 6, 0.12) 32%, rgba(180, 83, 9, 0.04) 58%, transparent 75%);
      transition: background 0.3s ease-out, transform 0.2s ease-out;
      animation: ambientBreathe 7s infinite ease-in-out;
    }

    @keyframes ambientBreathe {
      0%, 100% { opacity: 0.75; transform: scale(0.97); }
      50% { opacity: 1.0; transform: scale(1.03); }
    }

    /* Layer 4: Portrait with smooth bottom fade and subtle grounding shadow */
    .cutout-img {
      pointer-events: none;
      transform-origin: 50% 90%;
      transition: transform 0.12s ease-out;
      -webkit-mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);
      mask-image: linear-gradient(to top, transparent 0%, black 14%, black 100%);
      filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.25));
    }

    .pulse-dot {
      animation: pulseAnim 2s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    input[type="range"] {
      accent-color: #F59E0B;
    }
  </style>
</head>
<body class="hero-bg-dark text-neutral-200 antialiased">
  <div id="root-container" class="max-w-2xl mx-auto">
    
    <!-- Controls Toolbar: Status, Glow Adjustments & Theme Toggle -->
    <div class="pb-2.5 px-1 space-y-1.5 text-xs">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="font-semibold uppercase tracking-wider text-amber-400/90 flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-amber-400 inline-block"></span>
            Studio Portrait × Adaptive Ambient Glow
          </span>
          <span class="px-2 py-0.5 rounded text-[11px] font-mono bg-amber-950/40 text-amber-300 border border-amber-800/50">Orbit Behind</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="theme-btn" class="px-2.5 py-0.5 rounded text-[11px] font-medium border border-neutral-700 bg-neutral-800/80 hover:bg-neutral-700 text-neutral-200 transition cursor-pointer">
            Theme: <span id="theme-label" class="text-amber-400 font-semibold">Dark (#14140F)</span>
          </button>
          <button id="badge-toggle-btn" class="px-2.5 py-0.5 rounded text-[11px] font-medium border border-neutral-700 bg-neutral-800/80 hover:bg-neutral-700 text-neutral-200 transition cursor-pointer">
            Badge: <span id="badge-state" class="text-emerald-400 font-semibold">ON</span>
          </button>
        </div>
      </div>

      <!-- Live Ambient Glow Intensity Slider -->
      <div class="flex items-center gap-2 pt-0.5">
        <span class="text-[11px] text-neutral-400 shrink-0">Ambient Glow:</span>
        <input type="range" id="glow-slider" min="0" max="100" step="5" value="75" class="w-full h-1.5 bg-neutral-800 rounded-lg appearance-none cursor-pointer">
        <span id="glow-val" class="text-[11px] font-mono text-amber-300 w-9 text-right shrink-0">75%</span>
      </div>
    </div>

    <!-- The Visual Card (Matches Hero Background #14140F, 480px height) -->
    <div id="preview-card" class="relative w-full h-[480px] rounded-2xl overflow-hidden border border-neutral-800/80 hero-bg-dark shadow-2xl flex items-center justify-center cursor-crosshair">
      
      <!-- Layer 1: Solid Dark Background (#14140F) -->
      <div class="absolute inset-0 bg-[#14140F]"></div>

      <!-- Layer 2: Adaptive Ambient Glow (Golden amber backlight behind portrait) -->
      <div id="ambient-glow" class="ambient-glow-layer"></div>

      <!-- Layer 3: Live Orbiting Canvas Network (Z-Index 10: nodes orbit BEHIND the portrait!) -->
      <canvas id="orbit-canvas" class="absolute inset-0 w-full h-full z-10"></canvas>

      </div>

      <!-- Layer 5: Synergies Badge Overlay (Z-Index 30) -->
      <div id="badge-overlay" class="absolute bottom-3 left-3 right-3 z-30 flex items-center justify-between pointer-events-none transition-opacity duration-200">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-neutral-900/85 backdrop-blur-md border border-neutral-800/90 text-[11px] text-neutral-300 shadow-xl">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>
          <span>Active Synergies: UI × Agent Engine</span>
        </div>
        <span class="text-[10px] text-neutral-400/80 font-mono tracking-tight bg-neutral-900/70 backdrop-blur-sm px-2.5 py-1 rounded">Move cursor to orbit</span>
      </div>
    </div>

    <!-- Metadata Details -->
    <div class="mt-2 text-center text-[11px] text-neutral-500 font-mono">
      Studio Editorial Lighting &bull; Orbiting Canvas Behind Portrait &bull; Adaptive Golden Glow &bull; Smooth Bottom Fade
    </div>
  </div>

  <script>
    const previewCard = document.getElementById('preview-card');
    const cutoutImg = document.getElementById('cutout-img');
    const ambientGlow = document.getElementById('ambient-glow');
    const glowSlider = document.getElementById('glow-slider');
    const glowVal = document.getElementById('glow-val');
    const badgeToggleBtn = document.getElementById('badge-toggle-btn');
    const badgeState = document.getElementById('badge-state');
    const badgeOverlay = document.getElementById('badge-overlay');
    const themeBtn = document.getElementById('theme-btn');
    const themeLabel = document.getElementById('theme-label');

    let isDarkTheme = true;
    let glowIntensity = 0.75;

    // Glow Slider
    glowSlider.addEventListener('input', (e) => {
      glowIntensity = parseInt(e.target.value, 10) / 100.0;
      glowVal.textContent = `${e.target.value}%`;
      updateAmbientGlow();
    });

    function updateAmbientGlow(cx = 50, cy = 36) {
      const alpha1 = (0.24 * glowIntensity).toFixed(3);
      const alpha2 = (0.12 * glowIntensity).toFixed(3);
      const alpha3 = (0.04 * glowIntensity).toFixed(3);

      if (isDarkTheme) {
        ambientGlow.style.background = `radial-gradient(circle at ${cx}% ${cy}%, rgba(245, 158, 11, ${alpha1}) 0%, rgba(217, 119, 6, ${alpha2}) 32%, rgba(180, 83, 9, ${alpha3}) 58%, transparent 75%)`;
      } else {
        ambientGlow.style.background = `radial-gradient(circle at ${cx}% ${cy}%, rgba(245, 158, 11, ${alpha1 * 0.7}) 0%, rgba(217, 119, 6, ${alpha2 * 0.7}) 30%, transparent 65%)`;
      }
    }

    // Theme Toggle
    themeBtn.addEventListener('click', () => {
      isDarkTheme = !isDarkTheme;
      if (isDarkTheme) {
        previewCard.classList.remove('hero-bg-light');
        previewCard.classList.add('hero-bg-dark');
        themeLabel.textContent = 'Dark (#14140F)';
        themeLabel.className = 'text-amber-400 font-semibold';
      } else {
        previewCard.classList.remove('hero-bg-dark');
        previewCard.classList.add('hero-bg-light');
        themeLabel.textContent = 'Light (#F8F8F5)';
        themeLabel.className = 'text-blue-400 font-semibold';
      }
      updateAmbientGlow();
    });

    // Badge Toggle
    let badgeVisible = true;
    badgeToggleBtn.addEventListener('click', () => {
      badgeVisible = !badgeVisible;
      badgeOverlay.style.opacity = badgeVisible ? '1' : '0';
      badgeState.textContent = badgeVisible ? 'ON' : 'OFF';
      badgeState.className = badgeVisible ? 'text-emerald-400 font-semibold' : 'text-neutral-500 font-semibold';
    });

    // Orbiting Physics Canvas with refined Micro-Nodes (Z-INDEX 10: behind portrait)
    const canvas = document.getElementById('orbit-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resize() {
      width = canvas.width = previewCard.clientWidth;
      height = canvas.height = previewCard.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // 5 sleek micro-nodes representing your core disciplines
    const nodes = [
      { label: 'Human Intent', x: width * 0.16, y: height * 0.18, vx: 0.20, vy: 0.12, radius: 3.5, color: '#A855F7' },
      { label: 'Spatial UI', x: width * 0.84, y: height * 0.22, vx: -0.16, vy: 0.16, radius: 3.3, color: '#38BDF8' },
      { label: 'Agent Loop', x: width * 0.28, y: height * 0.08, vx: 0.12, vy: -0.10, radius: 3.6, color: '#34D399' },
      { label: 'Design Tokens', x: width * 0.12, y: height * 0.50, vx: -0.10, vy: 0.10, radius: 3.2, color: '#F472B6' },
      { label: 'Browser Runtime', x: width * 0.88, y: height * 0.48, vx: 0.14, vy: -0.10, radius: 3.4, color: '#FBBF24' }
    ];

    let mouse = { x: -1000, y: -1000, active: false };

    previewCard.addEventListener('mousemove', (e) => {
      const rect = previewCard.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;

      // 3D Parallax tilt: portrait moves subtly with mouse
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const dx = (mouse.x - cx) / cx;
      const dy = (mouse.y - cy) / cy;
      
      // Portrait subtle 3D translation
      cutoutImg.style.transform = `translate3d(${dx * 6}px, ${dy * 3}px, 0)`;

      // Adaptive ambient glow responds dynamically to mouse position
      const glowX = 50 + dx * 10;
      const glowY = 36 + dy * 6;
      updateAmbientGlow(glowX, glowY);
    });

    previewCard.addEventListener('mouseleave', () => {
      mouse.active = false;
      mouse.x = -1000;
      mouse.y = -1000;
      cutoutImg.style.transform = 'translate3d(0, 0, 0)';
      updateAmbientGlow(50, 36);
    });

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // Head clearance zone so nodes gracefully drift around head
      const headCenterX = width * 0.5;
      const headCenterY = height * 0.24;
      const headRadius = 88;

      // Node movement
      nodes.forEach(node => {
        node.x += node.vx;
        node.y += node.vy;

        // Boundary bounce
        if (node.x - node.radius < 12 || node.x + node.radius > width - 12) node.vx *= -1;
        if (node.y - node.radius < 12 || node.y + node.radius > height - 12) node.vy *= -1;

        // Gentle head clearance repulsion
        const dHeadX = node.x - headCenterX;
        const dHeadY = node.y - headCenterY;
        const distHead = Math.hypot(dHeadX, dHeadY);
        if (distHead < headRadius && distHead > 0) {
          node.x += (dHeadX / distHead) * 0.7;
          node.y += (dHeadY / distHead) * 0.7;
        }

        // Mouse repulsion
        if (mouse.active) {
          const dx = mouse.x - node.x;
          const dy = mouse.y - node.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 130 && dist > 0) {
            node.x -= (dx / dist) * 0.8;
            node.y -= (dy / dist) * 0.8;
          }
        }
      });

      // Connections: delicate micro-lines (0.8px) behind portrait
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const dx = nodes[i].x - nodes[j].x;
          const dy = nodes[i].y - nodes[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < 230) {
            const alpha = (1 - dist / 230) * 0.24;
            ctx.beginPath();
            ctx.strokeStyle = `rgba(245, 158, 11, ${alpha})`;
            ctx.lineWidth = 0.8;
            ctx.moveTo(nodes[i].x, nodes[i].y);
            ctx.lineTo(nodes[j].x, nodes[j].y);
            ctx.stroke();
          }
        }
      }

      // Micro-Nodes & Sleek Typography (behind portrait)
      nodes.forEach(node => {
        // Subtle glow halo
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 2, 0, Math.PI * 2);
        ctx.fillStyle = isDarkTheme ? 'rgba(245, 158, 11, 0.08)' : 'rgba(0, 0, 0, 0.04)';
        ctx.fill();

        // Node center
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.fillStyle = node.color;
        ctx.fill();

        // Node label (sleek, small 9.5px)
        ctx.font = '500 9.5px -apple-system, BlinkMacSystemFont, sans-serif';
        ctx.fillStyle = isDarkTheme ? '#A3A3A3' : '#666666';
        ctx.textAlign = 'center';
        ctx.fillText(node.label, node.x, node.y - node.radius - 5);
      });

      requestAnimationFrame(animate);
    }
    animate();
  </script>
